<style>
:root{--ink:#efe4cf;--gold:#d8b46a;--gold2:#f3dca5;--esp:#0c0807;--esp2:#1a120d;--cham:#e9dcc6;--line:rgba(216,180,106,.35);--g:clamp(20px,5vw,72px);--fogA:0;--dark:1}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--esp);color:var(--ink);-webkit-text-size-adjust:100%}
body{font-family:'Readex Pro',sans-serif;font-weight:300;line-height:1.85;overflow-x:hidden;background:var(--esp)}
html.lenis,html.lenis body{height:auto}.lenis.lenis-smooth{scroll-behavior:auto!important}
a{color:inherit;text-decoration:none}
.lat{font-family:'Cormorant Garamond',serif;letter-spacing:.42em;text-transform:uppercase;font-weight:300;font-size:11px;direction:ltr;unicode-bidi:isolate}
.disp{font-family:'Amiri',serif;font-weight:400;line-height:1.35}
/* fixed stage layers */
#bg,#titleL,#gl,#fogF,#ov{position:fixed;inset:0;pointer-events:none}
#bg{z-index:0;background:var(--esp)}
#bg .base{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 40%,#2a1810 0%,#120b08 45%,#070504 100%)}
#bg .fog{position:absolute;inset:-10%;opacity:var(--fogA);background:radial-gradient(70% 60% at 50% 55%,#f6eddc 0%,#e9dcc6 45%,#d6c3a3 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.75;background:radial-gradient(circle,#fffaf0 0%,rgba(255,250,240,0) 70%);animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(8vw,-4vh,0) scale(1.25)}}
#titleL{z-index:1;display:flex;align-items:center;justify-content:center}
#title{display:flex;gap:clamp(90px,26vw,420px);align-items:center;color:#6e5640;font-family:'Amiri',serif;font-size:clamp(54px,11vw,170px);line-height:1;opacity:.0;transform:translateY(-2vh)}
#title span{display:block;white-space:nowrap}
.streaks{position:absolute;inset:0;opacity:0}
.streaks i{position:absolute;top:-40vh;width:1px;height:38vh;background:linear-gradient(transparent,rgba(255,255,255,.9),transparent);animation:fall linear infinite}
@keyframes fall{to{transform:translateY(150vh)}}
#gl{z-index:2;width:100%;height:100%}
#fogF{z-index:3;opacity:0;background:radial-gradient(80% 70% at 50% 45%,rgba(248,240,226,.97),rgba(233,220,198,.98) 60%,#dccab0)}
#fogF .blob{opacity:.9}
#ov{z-index:4}
.stage{position:absolute;inset:0;display:flex;opacity:0;visibility:hidden}
/* header */
header{position:fixed;top:0;inset-inline:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:22px var(--g);transition:color .6s}
.brand{display:flex;align-items:center;gap:12px}
.brand b{font-family:'Amiri';font-weight:400;font-size:20px;letter-spacing:0}
.dia{width:22px;height:22px;flex:none}
nav{display:flex;gap:34px;font-size:13px}
nav a{opacity:.75;transition:opacity .3s}nav a:hover{opacity:1}
header.onfog{color:#4a3726}
.prog{position:fixed;bottom:26px;left:var(--g);z-index:20;width:34px;height:34px;border:1px solid currentColor;border-radius:50%;opacity:.55;display:grid;place-items:center;font-size:10px}
/* story */
#story{position:relative;height:1100vh;z-index:5}
#s0{align-items:flex-end;justify-content:space-between;padding:0 var(--g) 9vh}
#s0 .hint{font-size:12px;opacity:.6}
#s0 .lead{max-width:340px}
#s0 .lead p{font-size:14px;opacity:.75;margin-top:10px}
.intro{align-items:center;justify-content:center;text-align:center;color:#3e2d1f;padding:0 var(--g)}
.intro .in{max-width:640px}
.intro .lat{color:#8a6a45;display:block;margin-bottom:22px}
.intro h2{font-size:clamp(34px,4.6vw,62px);margin-bottom:22px;color:#3a2919}
.intro p{font-size:clamp(15px,1.3vw,18px);color:#5a4632;max-width:520px;margin:0 auto}
.rule{width:56px;height:1px;background:#a7865a;margin:26px auto 0}
#s4{align-items:center;padding:0 var(--g)}
#s4 .in{max-width:440px}
#s4 .lat{color:var(--gold);display:flex;gap:14px;align-items:center;margin-bottom:26px}
#s4 h2{font-size:clamp(44px,5.6vw,84px);color:var(--gold2);margin-bottom:18px}
#s4 p{opacity:.75;margin-bottom:36px;max-width:360px}
.btn{display:inline-flex;align-items:center;gap:14px;border:1px solid var(--line);padding:14px 30px;font-size:14px;color:var(--gold2);transition:background .5s,border-color .5s;pointer-events:auto;border-radius:0}
.btn:hover{background:rgba(216,180,106,.08);border-color:var(--gold)}
.btn::after{content:"";width:22px;height:1px;background:currentColor}
#s5{align-items:flex-end;justify-content:center;padding:0 var(--g) 7vh;text-align:center}
#s5 .in{width:100%;max-width:1080px}
#s5 h2{font-size:clamp(30px,3.6vw,50px);color:var(--gold2)}
#s5 .lat{color:var(--gold);display:block;margin-bottom:10px}
.karats{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,2vw,28px);margin-top:28px;pointer-events:auto}
.kc{border:1px solid rgba(216,180,106,.22);background:linear-gradient(160deg,rgba(40,26,16,.55),rgba(12,8,7,.4));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:22px 18px;text-align:center;position:relative}
.kc .k{font-family:'Cormorant Garamond';font-size:clamp(30px,3vw,44px);color:var(--gold2);line-height:1;direction:ltr}
.kc .n{font-size:12px;opacity:.65;margin:6px 0 12px}
.kc .p{font-size:clamp(18px,1.8vw,24px);direction:ltr;font-weight:200}
.kc .p small{font-size:11px;opacity:.6}
.tag{position:absolute;top:10px;inset-inline-start:10px;font-size:10px;border:1px solid rgba(216,180,106,.4);color:var(--gold);padding:0 8px}
.note{font-size:11.5px;opacity:.55;margin-top:16px}
/* sections */
section.sec{position:relative;z-index:6;background:var(--esp)}
#black{background:#050403;padding:28vh var(--g)}
#black p{font-family:'Amiri';font-size:clamp(24px,2.7vw,40px);line-height:1.75;max-width:880px;color:#e7dac2}
#black .lat{color:var(--gold);display:block;margin-bottom:30px}
#values{background:#0d0907}
#values .vbg{position:sticky;top:0;height:100vh;margin-bottom:-100vh;background:url(img/blur.jpg) center/cover;opacity:.55}
#values .vbg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,9,7,.6),rgba(13,9,7,.2) 40%,rgba(13,9,7,.85))}
.wrap{position:relative;max-width:1280px;margin:0 auto;padding:0 var(--g)}
.vrow{display:grid;grid-template-columns:5fr 7fr;gap:var(--g);padding:22vh 0 6vh;align-items:start}
.vrow h3{font-size:clamp(32px,3.6vw,54px);color:var(--gold2)}
.vrow .lat{color:var(--gold);display:block;margin-bottom:18px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:34px 44px;padding-top:12px}
.cols h4{font-weight:400;font-size:16px;color:var(--gold2);margin-bottom:8px;padding-top:14px;border-top:1px solid var(--line)}
.cols p{font-size:14.5px;opacity:.72}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,2vw,26px);padding:6vh 0 22vh}
.c3{position:relative;aspect-ratio:4/5;overflow:hidden;background:#140e0a}
.c3 img,.coll img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.4s cubic-bezier(.2,.7,.2,1),filter 1s}
.c3 figcaption{position:absolute;bottom:0;inset-inline:0;padding:22px;background:linear-gradient(transparent,rgba(8,5,4,.85));font-family:'Amiri';font-size:22px;color:var(--gold2)}
.c3:hover img{transform:scale(1.05)}
.shead{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:48px}
.shead h2{font-size:clamp(34px,4vw,60px);color:var(--gold2)}
.shead .lat{color:var(--gold);display:block;margin-bottom:14px}
.shead p{max-width:380px;opacity:.7;font-size:14.5px}
#collections{padding:20vh 0;background:linear-gradient(#0d0907,#120c09)}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(12px,1.6vw,22px)}
.coll{position:relative;overflow:hidden;background:#140e0a;grid-column:span 2;aspect-ratio:3/4;outline:1px solid rgba(216,180,106,.12);outline-offset:-1px}
.coll.w{grid-column:span 3;aspect-ratio:4/3}
.coll .cap{position:absolute;inset:auto 0 0 0;padding:22px 24px;display:flex;justify-content:space-between;align-items:end;background:linear-gradient(transparent,rgba(8,5,4,.88))}
.coll h3{font-family:'Amiri';font-weight:400;font-size:clamp(22px,2vw,30px);color:var(--gold2);line-height:1.2}
.coll .cnt{font-size:12px;opacity:.6}
.coll .ar{width:38px;height:38px;border:1px solid var(--line);display:grid;place-items:center;transform:rotate(45deg);transition:.6s;flex:none}
.coll .ar span{transform:rotate(-45deg);font-size:13px}
.coll:hover img{transform:scale(1.06);filter:brightness(1.08)}
.coll:hover .ar{background:var(--gold);color:#120c09;border-color:var(--gold)}
.coll::before{content:"";position:absolute;inset:12px;border:1px solid rgba(243,220,165,0);z-index:2;transition:border-color .8s;pointer-events:none}
.coll:hover::before{border-color:rgba(243,220,165,.35)}
#services{padding:18vh 0;background:#0c0807;border-top:1px solid rgba(216,180,106,.1)}
.svc{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.svc div{padding:38px 28px 10px 0;border-inline-start:1px solid rgba(216,180,106,.14);padding-inline-start:28px}
.svc div:first-child{border-inline-start:0;padding-inline-start:0}
.svc svg{width:34px;height:34px;stroke:var(--gold);fill:none;stroke-width:1;margin-bottom:22px}
.svc h4{font-family:'Amiri';font-weight:400;font-size:24px;color:var(--gold2);margin-bottom:10px}
.svc p{font-size:14px;opacity:.7}
.svc .num{font-family:'Cormorant Garamond';font-size:13px;color:var(--gold);opacity:.7;display:block;margin-bottom:8px;direction:ltr;text-align:right}
#visit{padding:18vh 0;background:radial-gradient(90% 80% at 80% 20%,#24170f,#0c0807 70%)}
.vgrid{display:grid;grid-template-columns:6fr 5fr;gap:var(--g);align-items:center}
.vgrid h2{font-size:clamp(36px,4.4vw,66px);color:var(--gold2);margin-bottom:22px}
.vgrid .lat{color:var(--gold);display:block;margin-bottom:16px}
.vgrid>div>p{opacity:.75;max-width:460px;margin-bottom:36px}
.info{border:1px solid var(--line);padding:clamp(24px,3vw,44px)}
.info dl{display:grid;grid-template-columns:auto 1fr;gap:16px 28px;font-size:14.5px}
.info dt{color:var(--gold);font-size:12.5px;padding-top:2px}
.info dd{opacity:.82}
.ph{font-size:11px;opacity:.5;margin-top:18px}
footer{position:relative;z-index:6;background:#070504;padding:60px var(--g) 40px;border-top:1px solid rgba(216,180,106,.12);font-size:12.5px}
.fg{display:flex;justify-content:space-between;flex-wrap:wrap;gap:24px;align-items:center;max-width:1280px;margin:0 auto}
footer .muted{opacity:.5}
.reveal{opacity:0;transform:translateY(34px)}
@media (max-width:820px){
 nav{display:none}
 #s0{flex-direction:column;align-items:flex-start;gap:14px;padding-bottom:7vh}
 #s4{align-items:flex-start;padding-top:16vh}
 #s4 h2{font-size:46px}
 .karats{grid-template-columns:1fr;gap:8px}
 .kc{padding:12px 16px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;text-align:start}
 .kc .n{margin:0}
 .tag{position:static;order:4;grid-column:1/-1;justify-self:start;display:none}
 .vrow{grid-template-columns:1fr;padding-top:16vh;gap:26px}
 .cols{grid-template-columns:1fr;gap:22px}
 .cards3{grid-template-columns:1fr 1fr;padding-bottom:14vh}.cards3 .c3:last-child{grid-column:span 2;aspect-ratio:16/10}
 .grid{grid-template-columns:1fr 1fr}.coll,.coll.w{grid-column:span 1;aspect-ratio:3/4}.coll.w:first-child{grid-column:span 2;aspect-ratio:4/3}
 .coll .cap{padding:14px}.coll .ar{display:none}
 .shead{flex-direction:column;align-items:flex-start}
 .svc{grid-template-columns:1fr}.svc div{border-inline-start:0;padding:28px 0 18px;border-bottom:1px solid rgba(216,180,106,.14)}
 .vgrid{grid-template-columns:1fr}
 #title{gap:44vw;font-size:46px}
}
</style>
</head>

show('#s1',41,48);show('#s2',51,58);show('#s3',61,68);
tl.to(S,{fogF:0,fog:0,duration:6,ease:'power2.inOut'},70).set(S,{neckV:1},69)
 .fromTo(S,{neckX:4.5},{neckX:mob?0:-1.15,duration:12,ease:'power2.out'},70).to(S,{neckRot:1.6,duration:22},70);
show('#s4',75,85,24);
tl.to(S,{neckX:mob?-5:-5.5,duration:7,ease:'power2.in'},84).set(S,{neckV:0},91)
 .to(S,{dust:1,duration:5},86).fromTo(S,{dustS:7},{dustS:mob?.68:1.0,duration:9,ease:'power2.out'},86);
show('#s5',93,null,24);tl.to({},{duration:4},97);
ScrollTrigger.create({trigger:'#story',start:'top top',end:'bottom top',onToggle:s=>{active=s.isActive||s.progress<1}});
