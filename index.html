<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دار الذهب — خاتم الإرث وطوق الملكة · نموذج تصميمي</title>
<meta name="theme-color" content="#000">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Readex+Pro:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
:root{--acc:#C9A24A;--acc2:#e9d29a;--ink:#f1ece2;--mut:rgba(241,236,226,.6);--g:clamp(20px,5vw,80px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;color:var(--ink)}
body{font-family:'Readex Pro',sans-serif;font-weight:300;line-height:1.8;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.disp{font-family:'Amiri',serif;font-weight:700;line-height:1.25}
.num{font-family:'Readex Pro';font-weight:200;direction:ltr;unicode-bidi:isolate;letter-spacing:-.04em;line-height:.9}
header{position:fixed;top:0;inset-inline:0;z-index:30;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 var(--g);background:linear-gradient(#000c,#0000);font-size:13px}
header b{font-family:'Amiri';font-size:19px;font-weight:400;display:flex;gap:10px;align-items:center}
header nav{display:flex;gap:28px;color:var(--mut)}
.pill{display:inline-flex;align-items:center;gap:10px;background:var(--acc);color:#140f06;font-weight:500;font-size:14px;padding:12px 26px;border-radius:999px;transition:background .4s,transform .4s;pointer-events:auto}
.pill:hover{background:var(--acc2)}
.pill.sm{padding:7px 16px;font-size:12.5px}
.ghost{display:inline-flex;gap:8px;color:var(--acc);font-size:14px;pointer-events:auto}
#pin{position:relative;height:1150vh}
#stage{position:sticky;top:0;height:100vh;overflow:hidden}
#spot{position:absolute;left:50%;top:56%;width:90vmin;height:60vmin;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(201,162,74,.22),rgba(201,162,74,.06) 55%,transparent);filter:blur(10px);pointer-events:none}
#word{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);font-family:'Amiri';font-weight:700;font-size:clamp(170px,33vw,560px);line-height:1;color:var(--acc);opacity:.16;white-space:nowrap;pointer-events:none;background:linear-gradient(180deg,#e9d29a,#C9A24A 55%,#6d5420);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.prod{position:absolute;left:50%;top:50%;width:min(72vw,1040px);aspect-ratio:16/9;transform:translate(-50%,-50%);pointer-events:none;will-change:transform}
.prod .im{position:absolute;inset:0;opacity:0}
.prod .im{-webkit-mask-image:radial-gradient(62% 64% at 50% 50%,#000 62%,transparent 100%);mask-image:radial-gradient(62% 64% at 50% 50%,#000 62%,transparent 100%)}
.prod .im img{width:100%;height:100%;object-fit:cover;display:block;mix-blend-mode:lighten}
.prod .im.on{opacity:1}
#collarP{width:min(78vw,1120px);aspect-ratio:16/9;top:46%;overflow:hidden;-webkit-mask-image:radial-gradient(60% 62% at 50% 50%,#000 55%,transparent 100%);mask-image:radial-gradient(60% 62% at 50% 50%,#000 55%,transparent 100%)}
#collarP .im{-webkit-mask-image:none;mask-image:none}#kb{position:absolute;inset:0;transform-origin:50% 50%;will-change:transform}
.gl{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;pointer-events:none;mix-blend-mode:screen;animation:tw 4.5s ease-in-out infinite;opacity:0}
.gl::before,.gl::after{content:"";position:absolute;left:50%;top:50%;background:radial-gradient(closest-side,var(--c,#fff),transparent);transform:translate(-50%,-50%)}
.gl::before{width:100%;height:2px}.gl::after{width:2px;height:100%}
.gl i{position:absolute;inset:30%;border-radius:50%;background:radial-gradient(closest-side,#fff,var(--c,#fff) 40%,transparent)}
@keyframes tw{0%,72%,100%{opacity:0;transform:scale(.3) rotate(0)}84%{opacity:.7;transform:scale(1) rotate(25deg)}}
.lines{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.lines path{fill:none;stroke:rgba(233,210,154,.85);stroke-width:.18;stroke-dasharray:1;stroke-dashoffset:1}
.lines.ld{opacity:0}
.lines circle{fill:var(--acc)}
.lab{position:absolute;font-size:14px;white-space:nowrap;color:var(--ink);opacity:0;transform:translateY(-50%)}
.lab small{display:block;color:var(--mut);font-size:11px}
.blk{position:absolute;opacity:0;visibility:hidden}
#hero{inset-inline-start:var(--g);bottom:12vh;max-width:380px}
#hero .eb,.eb{color:var(--acc);font-size:12.5px;letter-spacing:.02em;margin-bottom:14px;display:block}
#hero h1{font-size:clamp(38px,4.2vw,64px);margin-bottom:16px}
#hero p{color:var(--mut);margin-bottom:26px;font-size:15px}
.cta{display:flex;gap:22px;align-items:center}
#heroR{inset-inline-end:var(--g);bottom:12vh;text-align:left;color:var(--mut);font-size:12.5px;direction:rtl}
#heroR b{display:block;color:var(--ink);font-size:22px;font-weight:300}
.spec{inset-inline-start:var(--g);top:50%;transform:translateY(-50%);max-width:460px}
.spec .num{font-size:clamp(120px,13.5vw,230px);color:var(--ink);display:block;margin-bottom:6px;background:linear-gradient(180deg,#fff,#cdb98e);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.spec h3{font-size:clamp(28px,2.8vw,42px);margin-bottom:10px}
.spec p{color:var(--mut);font-size:15px;max-width:360px}
#detT{inset-inline-start:var(--g);bottom:12vh;max-width:420px}
#detT ul{display:none;list-style:none;margin-top:14px;color:var(--mut);font-size:14px}#detT li::before{content:'— ';color:var(--acc)}
#detT h3{font-size:clamp(30px,3vw,46px)}
.stTxt{inset-inline-start:var(--g);bottom:14vh;max-width:380px}
.stTxt h3{font-size:clamp(30px,3vw,46px);margin-bottom:8px}.stTxt p{color:var(--mut);font-size:15px}
#stNum{inset-inline-end:var(--g);top:50%;transform:translateY(-50%);text-align:left}
#stNum .num{font-size:clamp(110px,13vw,220px);display:block}
#stNum span{color:var(--mut);font-size:13px}
.dots{display:flex;gap:8px;margin-top:22px}.dots i{width:22px;height:2px;background:rgba(255,255,255,.2)}.dots i.on{background:var(--acc)}
#cust{inset-inline-start:var(--g);top:50%;transform:translateY(-50%);max-width:400px;pointer-events:auto}
#cust h3{font-size:clamp(34px,3.6vw,56px);margin-bottom:10px}
#cust p{color:var(--mut);margin-bottom:28px;font-size:15px}
.sw{display:flex;gap:14px}
.sw button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:12.5px;color:var(--mut)}
.sw button i{width:64px;height:64px;border-radius:14px;border:1px solid rgba(255,255,255,.12);transition:.4s;box-shadow:inset 0 0 0 4px #000}
.sw button.on{color:var(--ink)}.sw button.on i{border-color:var(--acc);box-shadow:inset 0 0 0 4px #000,0 0 0 1px var(--acc)}
#swName{margin-top:24px;font-size:13px;color:var(--acc)}
#close{inset-inline-start:var(--g);bottom:12vh;max-width:420px}
#close h3{font-size:clamp(36px,4vw,60px);margin-bottom:12px}
#close p{color:var(--mut);margin-bottom:24px}
#closeN{inset-inline-end:var(--g);top:16vh;text-align:left}
#closeN .num{font-size:clamp(120px,15vw,250px);display:block}
#closeN span{color:var(--mut);font-size:13px}
.prog{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);width:120px;height:2px;background:rgba(255,255,255,.12)}
.prog i{position:absolute;inset:0;background:var(--acc);transform-origin:right;transform:scaleX(0)}
/* compare */
#compare{padding:18vh var(--g) 14vh;max-width:1280px;margin:0 auto}
#compare .eb{margin-bottom:10px}
#compare h2{font-size:clamp(36px,4vw,60px);margin-bottom:12px}
#compare>p{color:var(--mut);max-width:520px;margin-bottom:56px}
.tbl{display:grid;grid-template-columns:1.1fr repeat(3,1fr);border-top:1px solid rgba(255,255,255,.12)}
.tbl>div{padding:22px 18px;border-bottom:1px solid rgba(255,255,255,.08);font-size:14.5px}
.tbl .h{font-size:13px;color:var(--mut)}
.tbl .k{padding-top:34px}
.tbl .k b{display:block;font-weight:200;font-size:clamp(44px,5vw,76px);line-height:1;direction:ltr;text-align:right;color:var(--ink)}
.tbl .k span{color:var(--acc);font-size:13px}
.tbl .k.hl b{color:var(--acc)}
footer{border-top:1px solid rgba(255,255,255,.08);padding:44px var(--g) 36px;font-size:12px;color:var(--mut)}
.fg{max-width:1280px;margin:0 auto;display:flex;flex-wrap:wrap;gap:18px 40px;justify-content:space-between}
.fg b{font-family:'Amiri';font-size:20px;font-weight:400;color:var(--ink)}
.cred{max-width:1280px;margin:26px auto 0;font-size:11px;line-height:1.9;opacity:.75}
.cred a{text-decoration:underline;text-underline-offset:3px}
@media(max-width:820px){
 header nav{display:none}
 .prod{width:118vw;top:34%}
 #collarP{width:130vw;top:33%}
 #word{top:34%;font-size:52vw}
 #spot{top:38%}
 #hero{bottom:9vh;inset-inline-end:var(--g)}
 #hero h1{font-size:38px}
 #heroR{display:none}
 .spec{top:auto;bottom:8vh;transform:none;inset-inline-end:var(--g)}
 .spec .num{font-size:110px}
 .spec h3{font-size:26px}
 #detT{top:auto;bottom:8vh;inset-inline-end:var(--g)}#detT ul{display:block}
 .lab,.lines{display:none}
 .stTxt{bottom:7vh;inset-inline-end:var(--g)}
 #stNum{top:11vh;bottom:auto;transform:none;inset-inline-end:auto;inset-inline-start:var(--g);text-align:right}
 #stNum .num{font-size:64px}
 #cust{top:auto;bottom:7vh;transform:none;inset-inline-end:var(--g)}
 #cust h3{font-size:34px}
 .sw button i{width:54px;height:54px}
 #close{bottom:7vh;inset-inline-end:var(--g)}
 #closeN{top:12vh}#closeN .num{font-size:96px}
 .tbl{grid-template-columns:1fr 1fr 1fr 1fr;font-size:12.5px}
 .tbl>div{padding:14px 6px;font-size:12.5px}
 .tbl .k b{font-size:34px}
}
</style>
</head>
<body>
<header><b><svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 1 23 12 12 23 1 12Z" fill="none" stroke="#C9A24A"/></svg><span id="brand"></span></b><nav id="nav"></nav><a class="pill sm" href="#compare" id="hcta"></a></header>

 states:{num:"3",numL:"صفوفٍ من الذهب المنقوش",img:"img/collar.webp",items:[

 close:{n:"12",nl:"قطعة فقط من هذا الإصدار",h:"اصنعي إرثكِ.",p:"احجزي موعدًا خاصًّا لتجربة الخاتم والطوق، واختيار العيار واللون والنقش.",cta:"احجزي قطعتكِ"},

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script>
const C=CONFIG,$=s=>document.querySelector(s),SHOT=location.search.includes('shot'),mob=innerWidth<820;
const GL={"ring0":[[42.7,55.7],[60.7,48.6],[68.5,44.4],[54.2,53.3],[27.3,38.2],[60.5,68.3],[73.4,53.5],[45.9,66.3]],"ring1":[[57.1,43.8],[71.3,35.6],[50.2,54.4],[74.8,55.4],[37.4,67.2],[36.2,48.5],[44.4,62.6]],"ring2":[[47.8,26],[38.1,17.9],[47.7,44.2],[75.3,24.2],[59.4,23.8],[70.8,37.4]],"ring-white":[[42.7,55.7],[60.7,48.6],[54.2,53.3],[60.5,68.3],[73.4,53.5]],"ring-rose":[[42.7,55.7],[60.7,48.6],[54.2,53.3],[60.5,68.3],[73.4,53.5]],"collar":[[50.2,46],[43.8,31.4],[60.2,43.6],[55.3,31.4],[42.3,55.7]]};
const hues=['#fff','#ffe9b0','#cfe6ff','#ffd2ea','#fff','#d9ffe9'];
const imgBox=(src,key)=>`<div class="im" data-k="${key}"><img src="${src}" alt="" decoding="async">${(GL[key]||[]).map((p,i)=>`<span class="gl" style="left:${p[0]}%;top:${p[1]}%;--c:${hues[i%6]};animation-delay:${(i*1.37)%4.5}s;animation-duration:${4+i%3}s"><i></i></span>`).join('')}</div>`;
$('#brand').textContent=C.brand;$('#fb').textContent=C.brand;$('#hcta').textContent=C.headerCta;$('#word').textContent=C.word;
$('#nav').innerHTML=C.nav.map(n=>`<a href="${n[1]}">${n[0]}</a>`).join('');
const R=['ring0','ring1','ring2'];
$('#ringP').innerHTML=R.map(k=>imgBox(`img/${k}.webp`,k)).join('')+imgBox('img/ring-white.webp','ring-white')+imgBox('img/ring-rose.webp','ring-rose')+
 `<svg class="lines ld" viewBox="0 0 100 100" preserveAspectRatio="none">${C.details.labels.map(l=>{const ex=l.l[0];return `<path pathLength="1" d="M${l.p[0]} ${l.p[1]} L${(l.p[0]+ex)/2} ${l.l[1]} L${ex} ${l.l[1]}"/>`}).join('')}</svg>`+
 C.details.labels.map(l=>`<div class="lab" style="${l.l[0]<50?'right':'left'}:${l.l[0]<50?100-l.l[0]:l.l[0]}%;top:${l.l[1]}%;${l.l[0]<50?'text-align:left;transform:translate(0,-50%);margin-right:8px':'margin-left:8px'}"><span>${l.t}</span><small>${l.s}</small></div>`).join('')+
 C.details.labels.map(l=>`<svg class="lines dot" viewBox="0 0 100 100" preserveAspectRatio="none" style="opacity:0"><circle cx="${l.p[0]}" cy="${l.p[1]}" r=".9"/></svg>`).join('');
$('#collarP').innerHTML=`<div id="kb">${imgBox(C.states.img,'collar')}</div>`;
const h=C.hero;$('#hero').innerHTML=`<span class="eb">${h.eb}</span><h1 class="disp">${h.h}</h1><p>${h.p}</p><div class="cta"><a class="pill" href="#compare">${h.cta}</a><a class="ghost" href="#pin">${h.more}</a></div>`;
$('#heroR').innerHTML=`${h.side[0]}<b>${h.side[1]}</b>`;
C.specs.forEach((s,i)=>$('#sp'+i).innerHTML=`<span class="num">${s.n}</span><h3 class="disp">${s.h}</h3><p>${s.p}</p>`);
$('#detT').innerHTML=`<span class="eb">${C.details.eb}</span><h3 class="disp">${C.details.h}</h3><ul>${C.details.labels.map(l=>`<li>${l.t}</li>`).join('')}</ul>`;
C.states.items.forEach((s,i)=>$('#st'+i).innerHTML=`<h3 class="disp">${s.h}</h3><p>${s.p}</p><div class="dots">${C.states.items.map((_,j)=>`<i class="${i==j?'on':''}"></i>`).join('')}</div>`);
$('#stNum').innerHTML=`<span class="num">${C.states.num}</span><span>${C.states.numL}</span>`;
const cu=C.custom;$('#cust').innerHTML=`<span class="eb">${cu.eb}</span><h3 class="disp">${cu.h}</h3><p>${cu.p}</p><div class="sw">${cu.items.map((s,i)=>`<button data-i="${i}" class="${i?'':'on'}"><i style="background:${s.c}"></i>${s.n}</button>`).join('')}</div><div id="swName">${cu.items[0].n} · ${cu.items[0].k}</div>`;
const cl=C.close;$('#close').innerHTML=`<h3 class="disp">${cl.h}</h3><p>${cl.p}</p><a class="pill" href="#compare">${cl.cta}</a>`;$('#closeN').innerHTML=`<span class="num">${cl.n}</span><span>${cl.nl}</span>`;
const cp=C.compare;$('#compare').innerHTML=`<span class="eb">${cp.eb}</span><h2 class="disp">${cp.h}</h2><p>${cp.p}</p><div class="tbl"><div class="k"></div>${cp.cols.map(c=>`<div class="k ${c.hl?'hl':''}"><b>${c.k}K</b><span>${c.n}</span></div>`).join('')}${cp.rows.map(r=>`<div class="h">${r[0]}</div>${r.slice(1).map(v=>`<div>${v}</div>`).join('')}`).join('')}</div>`;
$('#fnote').textContent=C.footer.note;$('#fdes').textContent=C.footer.design;
$('#cred').textContent=C.footer.credNote;

// ---------- motion ----------
gsap.registerPlugin(ScrollTrigger);
if(!SHOT){const l=new Lenis({lerp:.09});l.on('scroll',ScrollTrigger.update);gsap.ticker.add(t=>l.raf(t*1000));gsap.ticker.lagSmoothing(0)}
const ims=[...document.querySelectorAll('#ringP .im')],cims=[...document.querySelectorAll('#collarP .im')];
const S={ang:0,col:0,cst:0,custOn:0};let pick=-1;
function setRing(){const a=S.ang,c=S.cst,cv=S.custOn?(pick>=0?pick:Math.min(2,Math.round(S.col))):0;
 ims.forEach((e,i)=>{let o=i<3?Math.max(0,1-Math.abs(a-i))*(1-c):0;if(i==0&&cv==0)o=Math.max(o,c);if(i==3&&cv==1)o=c;if(i==4&&cv==2)o=c;e.style.opacity=o});
 document.querySelectorAll('.sw button').forEach((b,i)=>b.classList.toggle('on',i==cv));const it=cu.items[cv];$('#swName').textContent=it.n+' · '+it.k}
function setCollar(){cims.forEach(e=>e.style.opacity=1)}S.col2=0;
document.querySelectorAll('.sw button').forEach(b=>b.onclick=()=>{pick=+b.dataset.i;setRing()});
const tl=gsap.timeline({defaults:{ease:'none'},onUpdate:()=>{setRing();setCollar()},scrollTrigger:{trigger:'#pin',start:'top top',end:'bottom bottom',scrub:SHOT?true:1,onUpdate:s=>$('#pg').style.transform=`scaleX(${s.progress})`}});
const IN=(el,at,d=2,x=0,y=30)=>tl.fromTo(el,{autoAlpha:0,x,y},{autoAlpha:1,x:0,y:0,duration:d,ease:'power2.out'},at);
const OUT=(el,at,d=2,x=0,y=-24)=>tl.to(el,{autoAlpha:0,x,y,duration:d,ease:'power2.in'},at);
const MX=mob?0:-24;// product shift (vw) towards left side
gsap.set('#hero,#heroR',{autoAlpha:1});gsap.set('#collarP',{autoAlpha:0});tl.fromTo('#ringP',{scale:mob?.95:.74},{scale:mob?1:.8,duration:8},0).to({},{duration:1},0);
OUT('#hero',8);OUT('#heroR',8);tl.to('#word',{opacity:0,scale:.9,duration:4},8);
// specs: product moves aside + rotates through angles
tl.to('#ringP',{xPercent:mob?-50:-50,x:mob?0:MX+'vw',scale:mob?.85:.86,y:mob?'-4vh':0,duration:5,ease:'power2.inOut'},9);
tl.to(S,{ang:2,duration:24},10).to(S,{ang:1,duration:5},34);
C.specs.forEach((s,i)=>{IN('#sp'+i,11+i*7,2.5,mob?0:-80,0);OUT('#sp'+i,16+i*7,2.5,mob?0:60,0)});
tl.to('#spot',{left:mob?'50%':(50+MX)+'%',duration:5},9);
// details w/ leader lines
tl.to('#ringP',{x:mob?0:'4vw',scale:mob?.8:.92,duration:5,ease:'power2.inOut'},39).to(S,{ang:0,duration:5},39).to('#spot',{left:mob?'50%':'54%',duration:5},39);
IN('#detT',43);tl.to('#ringP .ld',{opacity:1,duration:.5},44.5);
document.querySelectorAll('#ringP .lines:not(.dot) path').forEach((p,i)=>tl.to(p,{strokeDashoffset:0,duration:3},45+i*1.5));
document.querySelectorAll('#ringP .dot').forEach((p,i)=>tl.to(p,{opacity:1,duration:1},44.5+i*1.5));
document.querySelectorAll('#ringP .lab').forEach((p,i)=>tl.to(p,{opacity:1,duration:2},47+i*1.5));
OUT('#detT',55);tl.to('#ringP .ld,#ringP .dot,#ringP .lab',{opacity:0,duration:2},55);
// ring up & out, collar states
tl.to('#ringP',{y:'-80vh',duration:5,ease:'power2.in'},56);
tl.fromTo('#collarP',{y:'80vh',autoAlpha:1},{immediateRender:false,autoAlpha:1,y:0,duration:5,ease:'power2.out'},58).to('#spot',{left:'50%',duration:3},58);
C.states.items.forEach((it,i)=>{if(i)tl.to('#kb',{scale:it.kb.scale,xPercent:it.kb.x,yPercent:it.kb.y,duration:5,ease:'sine.inOut'},59+i*7)});
IN('#stNum',60,3);C.states.items.forEach((s,i)=>{IN('#st'+i,59+i*7,2.5);if(i<2)OUT('#st'+i,64+i*7,2)});OUT('#st2',78);OUT('#stNum',78);
tl.to('#collarP',{y:'-85vh',duration:5,ease:'power2.in'},78);
// customizer
tl.fromTo('#ringP',{y:'80vh'},{immediateRender:false,y:0,x:mob?0:'-20vw',scale:mob?.85:.95,duration:5,ease:'power2.out'},80).set(S,{custOn:1},80).to(S,{cst:1,duration:.5},80).fromTo(S,{col:0},{immediateRender:false,col:2,duration:6,ease:'sine.inOut'},84.5).to(S,{col:0,duration:4,ease:'sine.inOut'},90.5);
tl.to('#spot',{left:mob?'50%':'30%',duration:3},80);
IN('#cust',83);OUT('#cust',95);
// closing
tl.to('#ringP',{x:0,scale:mob?.8:.85,duration:4,ease:'power2.inOut'},95).to('#spot',{left:'50%',duration:4},95).to('#word',{opacity:.16,scale:1,duration:4},95);
IN('#closeN',97,3,mob?0:-60,0);IN('#close',98);
tl.to({},{duration:6},101);
tl.to('#ringP',{y:'-90vh',duration:4,ease:'power2.in'},104).to('#close,#closeN,#word,#spot',{autoAlpha:0,y:'-30vh',duration:4,ease:'power2.in'},104);
// subtle parallax
const P={x:0,y:0};addEventListener('pointermove',e=>{P.x=e.clientX/innerWidth-.5;P.y=e.clientY/innerHeight-.5});
gsap.ticker.add(()=>{document.querySelectorAll('.prod .im img').forEach(im=>{im.style.transform=`translate3d(${P.x*-14}px,${P.y*-10}px,0) rotate(${P.x*1.2}deg)`});$('#word').style.translate=`${P.x*20}px ${P.y*12}px`});
setRing();setCollar();window.__ready=true;
</script>
</body></html>
